name: Build & Test

on:
  push:
    branches: [master, feature/*]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Build Debug
        run: |
          $version = git describe --tags --always 2>$null; if ($?) { $version } else { "dev" }
          msbuild CLIRPG_B2.sln \
            /p:Version=$version \
            /p:Configuration=Debug \
            /m:4 \
            /verbosity:minimal
      
      - name: Run Tests (if exists)
        run: |
          if (Test-Path "tests") {
            vstest.console.exe tests/CLIRPG_B2_UnitTests.dll
          } else {
            Write-Host "No test directory found, skipping..."
          }
      
      - name: Build Release
        run: |
          msbuild CLIRPG_B2.sln \
            /p:Configuration=Release \
            /m:4 \
            /verbosity:minimal
      
      - name: Upload Debug Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: x64/Debug/*.exe,*.pdb

      - name: Upload Release Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: x64/Release/*.exe,*.pdb
